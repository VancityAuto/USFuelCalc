<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Fuel Calc</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      color: var(--accent);
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      background-color: #0f172a;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .result-row:last-child {
      margin-bottom: 0;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>

<div class="card">
  <h2>US Fuel Calculator</h2>

  <!-- Vehicle Lookup -->
  <div class="form-group">
    <label>Select Vehicle (Year / Make / Model)</label>
    <div class="grid-3">
      <select id="yearSelect" onchange="updateMakes()"><option value="">Year</option></select>
      <select id="makeSelect" onchange="updateModels()" disabled><option value="">Make</option></select>
      <select id="modelSelect" onchange="applyVehicleSpecs()" disabled><option value="">Model</option></select>
    </div>
  </div>

  <!-- Fuel Tank Capacity -->
  <div class="form-group">
    <label for="tankCapacity">Tank Capacity (Litres)</label>
    <input type="number" id="tankCapacity" value="58" placeholder="e.g. 58" oninput="calculate()">
  </div>

  <!-- Remaining Fuel Level -->
  <div class="form-group">
    <label for="fuelLevel">Current Gauge Level</label>
    <select id="fuelLevel" onchange="calculate()">
      <option value="0">Empty (0%)</option>
      <option value="0.25" selected>1/4 Tank</option>
      <option value="0.50">1/2 Tank</option>
      <option value="0.75">3/4 Tank</option>
    </select>
  </div>

  <!-- US Gas Price -->
  <div class="form-group">
    <label for="usPrice">US Gas Price ($ USD / US Gallon)</label>
    <input type="number" step="0.01" id="usPrice" value="3.49" oninput="calculate()">
  </div>

  <!-- Exchange Rate -->
  <div class="form-group">
    <label for="fxRate">Exchange Rate (USD to CAD)</label>
    <input type="number" step="0.01" id="fxRate" value="1.38" oninput="calculate()">
  </div>

  <!-- Results Box -->
  <div class="result">
    <div class="result-row">
      <span>Litres Needed:</span>
      <span id="litresNeeded">-</span>
    </div>
    <div class="result-row">
      <span>Gallons Needed:</span>
      <span id="gallonsNeeded">-</span>
    </div>
    <div class="result-row">
      <span>Total Cost (USD):</span>
      <span id="costUSD">-</span>
    </div>
    <div class="result-row">
      <span>Total Cost (CAD):</span>
      <span id="costCAD">-</span>
    </div>
    <div class="result-row">
      <span>Equivalent Rate:</span>
      <span id="cadPerLitre">-</span>
    </div>
  </div>
</div>

<script>
  // Vehicle database preset (Easily expandable)
  const vehicleData = {
    "2011": {
      "Honda": {
        "CR-V": 58,
        "Civic": 50,
        "Accord": 70,
        "Pilot": 79
      },
      "Toyota": {
        "RAV4": 60,
        "Corolla": 50,
        "Camry": 70
      },
      "Ford": {
        "Escape": 62,
        "F-150": 98
      }
    },
    "2012": {
      "Honda": {
        "CR-V": 58,
        "Civic": 50,
        "Accord": 70
      },
      "Toyota": {
        "RAV4": 60,
        "Corolla": 50
      }
    },
    "2015": {
      "Honda": { "CR-V": 58 },
      "Toyota": { "RAV4": 60 }
    },
    "2020": {
      "Honda": { "CR-V": 53 },
      "Toyota": { "RAV4": 55 }
    }
  };

  const yearSelect = document.getElementById("yearSelect");
  const makeSelect = document.getElementById("makeSelect");
  const modelSelect = document.getElementById("modelSelect");

  // Populate Year dropdown on load
  function initVehicles() {
    for (let yr in vehicleData) {
      let opt = document.createElement("option");
      opt.value = yr;
      opt.textContent = yr;
      yearSelect.appendChild(opt);
    }
  }

  function updateMakes() {
    makeSelect.innerHTML = '<option value="">Make</option>';
    modelSelect.innerHTML = '<option value="">Model</option>';
    modelSelect.disabled = true;

    const selectedYear = yearSelect.value;
    if (!selectedYear) {
      makeSelect.disabled = true;
      return;
    }

    makeSelect.disabled = false;
    for (let make in vehicleData[selectedYear]) {
      let opt = document.createElement("option");
      opt.value = make;
      opt.textContent = make;
      makeSelect.appendChild(opt);
    }
  }

  function updateModels() {
    modelSelect.innerHTML = '<option value="">Model</option>';
    const selectedYear = yearSelect.value;
    const selectedMake = makeSelect.value;

    if (!selectedMake) {
      modelSelect.disabled = true;
      return;
    }

    modelSelect.disabled = false;
    const models = vehicleData[selectedYear][selectedMake];
    for (let model in models) {
      let opt = document.createElement("option");
      opt.value = model;
      opt.textContent = model;
      modelSelect.appendChild(opt);
    }
  }

  function applyVehicleSpecs() {
    const yr = yearSelect.value;
    const mk = makeSelect.value;
    const md = modelSelect.value;

    if (yr && mk && md) {
      const tankSize = vehicleData[yr][mk][md];
      document.getElementById("tankCapacity").value = tankSize;
      calculate();
    }
  }

  function calculate() {
    const tankCapacity = parseFloat(document.getElementById("tankCapacity").value) || 0;
    const fuelLevel = parseFloat(document.getElementById("fuelLevel").value) || 0;
    const usPrice = parseFloat(document.getElementById("usPrice").value) || 0;
    const fxRate = parseFloat(document.getElementById("fxRate").value) || 0;

    const litresNeeded = tankCapacity * (1 - fuelLevel);
    const gallonsNeeded = litresNeeded / 3.78541;
    const totalUSD = gallonsNeeded * usPrice;
    const totalCAD = totalUSD * fxRate;
    const cadPerLitre = litresNeeded > 0 ? (totalCAD / litresNeeded) : 0;

    document.getElementById("litresNeeded").textContent = litresNeeded.toFixed(1) + " L";
    document.getElementById("gallonsNeeded").textContent = gallonsNeeded.toFixed(2) + " gal";
    document.getElementById("costUSD").textContent = "$" + totalUSD.toFixed(2);
    document.getElementById("costCAD").textContent = "$" + totalCAD.toFixed(2);
    document.getElementById("cadPerLitre").textContent = "$" + cadPerLitre.toFixed(3) + " / L";
  }

  initVehicles();
  calculate();
</script>

</body>
</html>
