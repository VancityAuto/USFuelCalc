<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Fuel Calc</title>
  
  <!-- PWA Meta Tags & Web App Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="US Fuel Calc">

  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
      --positive: #4ade80;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      color: var(--accent);
      text-align: center;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .btn-link, .btn-action {
      display: block;
      text-align: center;
      background-color: #0f172a;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
    .btn-link:hover, .btn-action:hover { border-color: var(--accent); }

    .result {
      margin-top: 20px;
      padding: 16px;
      background-color: #0f172a;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .result-row:last-child {
      margin-bottom: 0;
      font-weight: bold;
      color: var(--accent);
    }
    .loading-text { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }

    /* Map Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      width: 90%;
      max-width: 650px;
    }
    #map { height: 380px; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>US Fuel Calculator</h2>

  <!-- Vehicle Lookup -->
  <div class="form-group">
    <label>Select Vehicle (Year / Make / Model)</label>
    <div class="grid-3">
      <select id="yearSelect" onchange="onYearSelected()"><option value="">Year</option></select>
      <select id="makeSelect" onchange="fetchModels()" disabled><option value="">Make</option></select>
      <select id="modelSelect" onchange="onModelSelected()" disabled><option value="">Model</option></select>
    </div>
    <div id="statusText" class="loading-text"></div>
  </div>

  <!-- Gas Station Selector & Map Modal Trigger -->
  <div class="form-group">
    <label for="selectedStationName">Selected Gas Station</label>
    <input type="text" id="selectedStationName" placeholder="Tap map button below to pick a station" readonly style="margin-bottom: 8px;">
    <div class="grid-2">
      <button class="btn-action" onclick="openMapModal()">🗺️ Map Gas Stations</button>
      <a id="gasbuddyBtn" href="https://www.gasbuddy.com" target="_blank" class="btn-link">⛽ GasBuddy Search</a>
    </div>
  </div>

  <!-- Fuel Tank Capacity -->
  <div class="form-group">
    <label for="tankCapacity">Tank Capacity (Litres)</label>
    <input type="number" id="tankCapacity" value="58" placeholder="e.g. 58" oninput="calculate()">
  </div>

  <!-- Remaining Fuel Level -->
  <div class="form-group">
    <label for="fuelLevel">Current Gauge Level</label>
    <select id="fuelLevel" onchange="calculate()">
      <option value="0">Empty (0%)</option>
      <option value="0.25" selected>1/4 Tank</option>
      <option value="0.50">1/2 Tank</option>
      <option value="0.75">3/4 Tank</option>
    </select>
  </div>

  <!-- US Gas Price -->
  <div class="form-group">
    <label for="usPrice">
