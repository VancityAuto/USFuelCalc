<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Fuel Calc</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      color: var(--accent);
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-link {
      display: block;
      text-align: center;
      background-color: #0f172a;
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .btn-link:hover {
      border-color: var(--accent);
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      background-color: #0f172a;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .result-row:last-child {
      margin-bottom: 0;
      font-weight: bold;
      color: var(--accent);
    }
    .loading-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>US Fuel Calculator</h2>

  <!-- Vehicle Lookup -->
  <div class="form-group">
    <label>Select Vehicle (Year / Make / Model)</label>
    <div class="grid-3">
      <select id="yearSelect" onchange="fetchMakes()"><option value="">Year</option></select>
      <select id="makeSelect" onchange="fetchModels()" disabled><option value="">Make</option></select>
      <select id="modelSelect" onchange="onModelSelected()" disabled><option value="">Model</option></select>
    </div>
    <div id="statusText" class="loading-text"></div>
  </div>

  <!-- Fuel Tank Capacity -->
  <div class="form-group">
    <label for="tankCapacity">Tank Capacity (Litres)</label>
    <input type="number" id="tankCapacity" value="58" placeholder="e.g. 58" oninput="calculate()">
  </div>

  <!-- Remaining Fuel Level -->
  <div class="form-group">
    <label for="fuelLevel">Current Gauge Level</label>
    <select id="fuelLevel" onchange="calculate()">
      <option value="0">Empty (0%)</option>
      <option value="0.25" selected>1/4 Tank</option>
      <option value="0.50">1/2 Tank</option>
      <option value="0.75">3/4 Tank</option>
    </select>
  </div>

  <!-- US Gas Price -->
  <div class="form-group">
    <label for="usPrice">US Gas Price ($ USD / US Gallon)</label>
    <input type="number" step="0.01" id="usPrice" value="3.49" oninput="calculate()">
  </div>

  <!-- Exchange Rate -->
  <div class="form-group">
    <label for="fxRate">Exchange Rate (USD to CAD)</label>
    <input type="number" step="0.01" id="fxRate" value="1.38" oninput="calculate()">
  </div>

  <!-- Border Crossing Section -->
  <div class="form-group">
    <label for="borderCrossing">Local Border Cameras (BC / WA)</label>
    <select id="borderCrossing" onchange="updateBorderCamera()">
      <option value="">Select Local Crossing (Optional)</option>
      <option value="peace-arch">Peace Arch (Hwy 99 / I-5)</option>
      <option value="pacific-highway">Pacific Highway (Hwy 15 / Truck Crossing)</option>
      <option value="aldergrove">Aldergrove / Lynden (Hwy 13)</option>
      <option value="abbotsford">Abbotsford / Sumas (Hwy 11)</option>
    </select>
    
    <div id="cameraLinkContainer" style="margin-top: 8px; font-size: 0.9rem; display: none;">
      🎥 <a id="cameraLink" href="#" target="_blank" style="color: var(--accent); text-decoration: underline;">View Live Local Camera Feed</a>
    </div>
  </div>

  <!-- National Border Trackers (Fallback for non-local users) -->
  <div class="form-group">
    <label>National Live Wait Times</label>
    <div class="grid-2">
      <a href="https://bwt.cbp.gov/" target="_blank" class="btn-link">🇺🇸 US CBP Wait Times</a>
      <a href="https://www.cbsa-asfc.gc.ca/bwt-taf/menu-eng.html" target="_blank" class="btn-link">🇨🇦 CBSA Wait Times</a>
    </div>
  </div>

  <!-- Results Box -->
  <div class="result">
    <div class="result-row">
      <span>Litres Needed:</span>
      <span id="litresNeeded">-</span>
    </div>
    <div class="result-row">
      <span>Gallons Needed:</span>
      <span id="gallonsNeeded">-</span>
    </div>
    <div class="result-row">
      <span>Total Cost (USD):</span>
      <span id="costUSD">-</span>
    </div>
    <div class="result-row">
      <span>Total Cost (CAD):</span>
      <span id="costCAD">-</span>
    </div>
    <div class="result-row">
      <span>Equivalent Rate:</span>
      <span id="cadPerLitre">-</span>
    </div>
  </div>
</div>

<script>
  const yearSelect = document.getElementById("yearSelect");
  const makeSelect = document.getElementById("makeSelect");
  const modelSelect = document.getElementById("modelSelect");
  const statusText = document.getElementById("statusText");

  const cameraLinks = {
    "peace-arch": "https://www.drivebc.ca/cameras/14",
    "pacific-highway": "https://www.drivebc.ca/cameras/15",
    "aldergrove": "https://www.drivebc.ca/cameras/16",
    "abbotsford": "https://www.drivebc.ca/cameras/17"
  };

  const tankDatabase = {
    "2011": {
      "HONDA": {
        "CR-V": 58,
        "Civic": 50,
        "Accord": 70
      },
      "TOYOTA": {
        "RAV4": 60,
        "Corolla": 50
      },
      "FORD": {
        "Escape": 62,
        "F-150": 98
      }
    }
  };

  function initYears() {
    for (let yr = 2026; yr >= 2000; yr--) {
      let opt = document.createElement("option");
      opt.value = yr;
      opt.textContent = yr;
      yearSelect.appendChild(opt);
    }
  }

  async function fetchMakes() {
    const yr = yearSelect.value;
    makeSelect.innerHTML = '<option value="">Make</option>';
    modelSelect.innerHTML = '<option value="">Model</option>';
    makeSelect.disabled = true;
    modelSelect.disabled = true;

    if (!yr) return;

    statusText.textContent = "Loading makes...";
    try {
      const res = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/GetMakesForManufacturerAndYear/mod?year=${yr}&format=json`);
      const data = await res.json();
      const makes = [...new Set(data.Results.map(item => item.MakeName))].sort();
      
      makes.forEach(make => {
        let opt = document.createElement("option");
        opt.value = make;
        opt.textContent = make;
        makeSelect.appendChild(opt);
      });

      makeSelect.disabled = false;
      statusText.textContent = "";
    } catch (e) {
      statusText.textContent = "Failed to load makes.";
    }
  }

  async function fetchModels() {
    const yr = yearSelect.value;
    const make = makeSelect.value;
    modelSelect.innerHTML = '<option value="">Model</option>';
    modelSelect.disabled = true;

    if (!make) return;

    statusText.textContent = "Loading models...";
    try {
      const res = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/getmodelsformakeyear/make/${encodeURIComponent(make)}/modelyear/${yr}?format=json`);
      const data = await res.json();
      const models = [...new Set(data.Results.map(item => item.Model_Name))].sort();
      
      models.forEach(model => {
        let opt = document.createElement("option");
        opt.value = model;
        opt.textContent = model;
        modelSelect.appendChild(opt);
      });

      modelSelect.disabled = false;
      statusText.textContent = "";
    } catch (e) {
      statusText.textContent = "Failed to load models.";
    }
  }

  function onModelSelected() {
    const yr = yearSelect.value;
    const make = makeSelect.value.toUpperCase();
    const model = modelSelect.value;

    if (tankDatabase[yr] && tankDatabase[yr][make] && tankDatabase[yr][make][model]) {
      document.getElementById("tankCapacity").value = tankDatabase[yr][make][model];
    }
    calculate();
  }

  function updateBorderCamera() {
    const selected = document.getElementById("borderCrossing").value;
    const container = document.getElementById("cameraLinkContainer");
    const link = document.getElementById("cameraLink");

    if (selected && cameraLinks[selected]) {
      link.href = cameraLinks[selected];
      container.style.display = "block";
    } else {
      container.style.display = "none";
    }
  }

  function calculate() {
    const tankCapacity = parseFloat(document.getElementById("tankCapacity").value) || 0;
    const fuelLevel = parseFloat(document.getElementById("fuelLevel").value) || 0;
    const usPrice = parseFloat(document.getElementById("usPrice").value) || 0;
    const fxRate = parseFloat(document.getElementById("fxRate").value) || 0;

    const litresNeeded = tankCapacity * (1 - fuelLevel);
    const gallonsNeeded = litresNeeded / 3.78541;
    const totalUSD = gallonsNeeded * usPrice;
    const totalCAD = totalUSD * fxRate;
    const cadPerLitre = litresNeeded > 0 ? (totalCAD / litresNeeded) : 0;

    document.getElementById("litresNeeded").textContent = litresNeeded.toFixed(1) + " L";
    document.getElementById("gallonsNeeded").textContent = gallonsNeeded.toFixed(2) + " gal";
    document.getElementById("costUSD").textContent = "$" + totalUSD.toFixed(2);
    document.getElementById("costCAD").textContent = "$" + totalCAD.toFixed(2);
    document.getElementById("cadPerLitre").textContent = "$" + cadPerLitre.toFixed(3) + " / L";
  }

  initYears();
  calculate();
</script>

</body>
</html>
